{% extends "base.html" %}
{% from "_macros.html" import admin_nav %}
{% block title %}Промокоди{% endblock %}
{% block content %}
{{ admin_nav('promocodes') }}
<header class="mb-6">
    <p class="mb-2 text-xs font-bold uppercase tracking-[0.16em] text-accent">Адміністрування</p>
    <h1 class="text-3xl font-bold tracking-tight">Промокоди</h1>
</header>

<div class="grid items-start gap-5 lg:grid-cols-[1fr_340px]">
    <section class="overflow-x-auto rounded-2xl border border-line bg-surface shadow-[var(--shadow-sm)]">
        <table class="w-full min-w-[680px] text-left text-sm">
            <thead class="bg-[#fff7f9]">
                <tr class="border-b border-line">
                    <th class="px-4 py-3">Код</th>
                    <th class="px-4 py-3">Знижка</th>
                    <th class="px-4 py-3">Мінімум</th>
                    <th class="px-4 py-3">Діє до</th>
                    <th class="px-4 py-3">Активний</th>
                    <th class="px-4 py-3">Дії</th>
                </tr>
            </thead>
            <tbody id="promocodes"></tbody>
        </table>
    </section>

    <form id="promocodeForm" class="space-y-4 rounded-2xl border border-line bg-surface p-5 shadow-[var(--shadow-sm)]">
        <h2 class="text-lg font-bold">Новий промокод</h2>
        <div>
            <label class="mb-1.5 block text-sm font-semibold">Код</label>
            <input name="code" maxlength="50" required
                   class="block w-full rounded-xl border border-line bg-[#fff7f9] px-3 py-2.5">
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="mb-1.5 block text-sm font-semibold">Знижка, %</label>
                <input name="discount_percent" type="number" min="0" max="100" step="0.01"
                       class="block w-full rounded-xl border border-line bg-[#fff7f9] px-3 py-2.5">
            </div>
            <div>
                <label class="mb-1.5 block text-sm font-semibold">Знижка, грн</label>
                <input name="discount_amount" type="number" min="0" step="0.01"
                       class="block w-full rounded-xl border border-line bg-[#fff7f9] px-3 py-2.5">
            </div>
        </div>
        <div>
            <label class="mb-1.5 block text-sm font-semibold">Мінімальне замовлення</label>
            <input name="min_order" type="number" min="0" step="0.01"
                   class="block w-full rounded-xl border border-line bg-[#fff7f9] px-3 py-2.5">
        </div>
        <div>
            <label class="mb-1.5 block text-sm font-semibold">Діє до</label>
            <input name="expires_at" type="date"
                   class="block w-full rounded-xl border border-line bg-[#fff7f9] px-3 py-2.5">
        </div>
        <label class="flex items-center gap-2 text-sm font-semibold">
            <input name="active" type="checkbox" checked class="h-4 w-4 accent-[#881337]">
            Активний
        </label>
        <button type="submit" class="w-full rounded-xl bg-accent px-5 py-3 text-sm font-bold text-white">
            Створити
        </button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/admin-promocodes.js') }}"></script>
{% endblock %}
