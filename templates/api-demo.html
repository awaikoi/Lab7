
{% extends "base.html" %}

{% block title %}API Demo{% endblock %}

{% block content %}

<header class="mb-6">
    <p class="mb-2 text-xs font-bold uppercase tracking-[0.16em] text-accent">Інтеграція</p>
    <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">API демо</h1>
    <p class="mt-2 text-sm text-ink/55">Швидке керування категоріями через API.</p>
</header>

<form id="categoryForm"
      class="mb-6 flex flex-col gap-3 rounded-2xl border border-line bg-surface p-5 shadow-[var(--shadow-sm)] sm:flex-row sm:items-end">

    <label class="flex-1">
        <span class="mb-1.5 block text-sm font-semibold">Назва категорії</span>
        <input
            name="name"
            required
            minlength="2"
            maxlength="100"
            placeholder="Наприклад: Аксесуари"
            class="block w-full rounded-xl border border-line bg-[#fff7f9] px-3 py-2.5"
        >
    </label>

    <label>
        <span class="mb-1.5 block text-sm font-semibold">Батьківська категорія</span>
        <select
            name="parent_id"
            class="min-w-52 rounded-xl border border-line bg-[#fff7f9] px-3 py-2.5"
        >
            <option value="">Коренева категорія</option>
        </select>
    </label>

    <button
        type="submit"
        class="rounded-xl bg-accent px-5 py-2.5 text-sm font-bold text-white"
    >
        Додати
    </button>
</form>

<section class="rounded-2xl border border-line bg-surface p-3 shadow-[var(--shadow-sm)]">
    <h2 class="px-2 pb-3 pt-1 text-lg font-bold">Категорії</h2>
    <ul id="categoryList" class="divide-y divide-line"></ul>
</section>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/api-demo.js') }}"></script>
{% endblock %}
