{% extends "base.html" %}
{% from "_macros.html" import admin_nav %}

{% block title %}Деталі замовлення{% endblock %}

{% block content %}

{{ admin_nav('orders') }}

<header class="mb-6">
    <p class="mb-2 text-xs font-bold uppercase tracking-[0.16em] text-accent">Адміністрування</p>
    <h1 class="text-3xl font-bold tracking-tight">Деталі замовлення</h1>
</header>

<div id="orderDetails"
     data-order-id="{{ order_id }}"
     class="space-y-5">
</div>

<a href="{{ url_for('admin.admin') }}"
   class="mt-5 inline-flex rounded-xl border border-line bg-surface px-4 py-2.5 text-sm font-bold text-accent transition hover:bg-[#fff7f9]">
    ← Повернутися до замовлень
</a>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/order-details.js') }}"></script>
{% endblock %}
